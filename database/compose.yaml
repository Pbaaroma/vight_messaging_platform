services:
  mongodb:
    image: mongo:7.0
    container_name: vight-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: vight_db

    volumes:
      - vight_mongo_data:/data/db

    networks:
      - vight-db-network

volumes:
  vight_mongo_data:

networks:
  vight-db-network:
    driver: bridge